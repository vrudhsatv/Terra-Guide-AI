# Runs the Terraform AI Reviewer (./terraform-ai-reviewer) on pull requests in this repository.
# The generic, reusable version for other repositories lives in
# terraform-ai-reviewer/.github/workflows/pr-reviewer.yml.
name: Terraform AI Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["**/*.tf", "**/*.tfvars", "terraform-ai-reviewer/**"]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: terraform-ai-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Terraform AI Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build reviewer image
        uses: docker/build-push-action@v6
        with:
          context: terraform-ai-reviewer
          tags: terraform-ai-reviewer:ci
          load: true
          cache-from: type=gha,scope=terraform-ai-reviewer
          cache-to: type=gha,mode=max,scope=terraform-ai-reviewer

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPORT_SCOPE: changed_files
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_STEP_SUMMARY:/tmp/step-summary.md" \
            -e GITHUB_STEP_SUMMARY=/tmp/step-summary.md \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_API_URL -e GITHUB_SERVER_URL \
            -e GITHUB_TOKEN -e ANTHROPIC_API_KEY -e OPENAI_API_KEY -e GEMINI_API_KEY \
            -e PR_NUMBER -e BASE_SHA -e HEAD_SHA -e BASE_REF -e REPORT_SCOPE \
            terraform-ai-reviewer:ci --output /workspace/review-report.json

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-ai-review-report
          path: review-report.json
          if-no-files-found: ignore
