name: Terraform-AI-Review-Agent

on:
  pull_request:
    paths: "terraform-review-agent/**"

jobs:
  terraform-ai-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: |
          pip install --quiet checkov
          checkov --version

      - name: Run Checkov (Terraform directory scan)
        run: |
          checkov \
            -d terraform-review-agent/terraform \
            --framework terraform \
            -o json \
            --quiet \
            --compact \
            --soft-fail \
            > checkov_report.json

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov_report.json

      # The Lambda expects {"results": {"violations": [...], "scan_summary": {...}}};
      # map Checkov's failed checks into that shape.
      - name: Build Lambda payload from Checkov report
        run: |
          jq '
            (if type == "array" then . else [.] end)
            | map(.results.failed_checks // []) | add // []
            | map({
                rule_id: .check_id,
                rule_name: .check_name,
                severity: ((.severity // "MEDIUM") | ascii_upcase),
                description: .check_name,
                resource_type: (.resource | split(".")[0]),
                resource_name: .resource,
                file: .file_path,
                line: .file_line_range[0]
              })
            | {
                results: {
                  violations: .,
                  scan_summary: {
                    violated_policies: length,
                    high: (map(select(.severity == "HIGH" or .severity == "CRITICAL")) | length),
                    medium: (map(select(.severity == "MEDIUM")) | length),
                    low: (map(select(.severity == "LOW" or .severity == "INFO")) | length)
                  }
                }
              }
          ' checkov_report.json > lambda_payload.json
          jq '.results.scan_summary' lambda_payload.json

      - name: Invoke Terraform AI Review Lambda
        id: ai_review
        run: |
          aws lambda invoke \
            --function-name terraform-ai-review-agent \
            --cli-binary-format raw-in-base64-out \
            --payload file://lambda_payload.json \
            response.json
          jq -r '.ai_review' response.json

      - name: Post AI Review as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body;
            try {
              const response = JSON.parse(fs.readFileSync('response.json', 'utf8'));
              const verdict = response.verdict || 'REJECT';
              const review = response.ai_review || 'No review text was generated.';
              const emoji = verdict === 'APPROVE' ? '✅'
                          : verdict === 'APPROVE_WITH_CHANGES' ? '⚠️'
                          : '❌';
              body = `## 🤖 AI Terraform Review\n\n**Verdict:** ${emoji} \`${verdict}\`\n\n${review}\n\n---\n*Automated review — final decision remains with the human reviewer.*`;
            } catch (e) {
              body = `## 🤖 AI Terraform Review\n\n**Verdict:** ❌ \`REJECT\` (fail-safe)\n\nThe review pipeline could not produce a readable response: ${e.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail PR if AI rejects
        run: |
          VERDICT=$(jq -r '.verdict' response.json)

          echo "🧠 AI Verdict: $VERDICT"

          if [[ "$VERDICT" == "REJECT" ]]; then
            echo "❌ AI Agent rejected Terraform changes"
            exit 1
          else
            echo "✅ AI Agent approved (or approved with changes)"
          fi
